<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span class="fa fa-check-circle" aria-hidden="true"></span>
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span class="fa fa-exclamation-circle" aria-hidden="true"></span>
    <span th:text="${error}"></span>
  </div>

  <div class="card mb-4" th:object="${owner}">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-sm-6">
          <span class="fa fa-user text-muted me-2" aria-hidden="true"></span>
          <strong th:text="#{name}">Name</strong>
          <p class="ms-4 mb-1"><b th:text="*{firstName + ' ' + lastName}"></b></p>
        </div>
        <div class="col-sm-6">
          <span class="fa fa-map-marker text-muted me-2" aria-hidden="true"></span>
          <strong th:text="#{address}">Address</strong>
          <p class="ms-4 mb-1" th:text="*{address}"></p>
        </div>
        <div class="col-sm-6">
          <span class="fa fa-building text-muted me-2" aria-hidden="true"></span>
          <strong th:text="#{city}">City</strong>
          <p class="ms-4 mb-1" th:text="*{city}"></p>
        </div>
        <div class="col-sm-6">
          <span class="fa fa-phone text-muted me-2" aria-hidden="true"></span>
          <strong th:text="#{telephone}">Telephone</strong>
          <p class="ms-4 mb-1" th:text="*{telephone}"></p>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary">
        <span class="fa fa-pencil" aria-hidden="true"></span>
        <span th:text="#{editOwner}">Edit Owner</span>
      </a>
      <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary">
        <span class="fa fa-plus" aria-hidden="true"></span>
        <span th:text="#{addNewPet}">Add New Pet</span>
      </a>
    </div>
  </div>

  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <div class="row">
    <div class="col-md-6 mb-4" th:each="pet : ${owner.pets}">
      <div class="card h-100">
        <div class="card-header">
          <span class="fa fa-paw me-2" aria-hidden="true"></span>
          <strong th:text="${pet.name}"></strong>
          <span class="badge bg-secondary ms-2" th:text="${pet.type}"></span>
        </div>
        <div class="card-body">
          <p class="mb-1">
            <span class="fa fa-birthday-cake text-muted me-1" aria-hidden="true"></span>
            <strong th:text="#{birthDate}">Birth Date</strong>:
            <span th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></span>
          </p>

          <table class="table table-sm mt-3" th:if="${!pet.visits.isEmpty()}">
            <thead>
              <tr>
                <th th:text="#{visitDate}">Visit Date</th>
                <th th:text="#{description}">Description</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="visit : ${pet.visits}">
                <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
                <td th:text="${visit?.description}"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer">
          <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" class="btn btn-primary btn-sm">
            <span class="fa fa-pencil" aria-hidden="true"></span>
            <span th:text="#{editPet}">Edit Pet</span>
          </a>
          <a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" class="btn btn-primary btn-sm">
            <span class="fa fa-calendar-plus-o" aria-hidden="true"></span>
            <span th:text="#{addVisit}">Add Visit</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Function to hide the success and error messages after 3 seconds
    function hideMessages() {
      var successMsg = document.getElementById("success-message");
      var errorMsg = document.getElementById("error-message");
      setTimeout(function () {
        if (successMsg) successMsg.style.display = "none";
        if (errorMsg) errorMsg.style.display = "none";
      }, 3000); // 3000 milliseconds (3 seconds)
    }

    // Call the function to hide messages
    hideMessages();
  </script>

</body>


</html>
